:root{
  --paper:#F6F4EF; --white:#FFFFFF; --night:#0A1230; --night2:#111C42; --line:#E2DED4; --line-n:#24305C;
  --muted:#4A5578; --muted-n:#9AA6C6;
  --blue:#0066FF; --cyan:#00D1FF; --violet:#8B5CFF; --magenta:#FF3D9A; --tangerine:#FF8A3D; --lime:#C6F432;
  --t-blue:#0057D9; --t-cyan:#00728F; --t-violet:#6A3FE0; --t-magenta:#C2186B; --t-tangerine:#B4500F; --t-lime:#4F7A00;
  --sev-c:#FF4D5E; --sev-h:#FFB020; --sev-m:#4D8DFF; --sev-l:#9AA6C6;
  --red:#FF2626;
  --radius:14px; --maxw:1200px;
  --f-head:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","IBM Plex Sans Arabic",ui-monospace,monospace;
  --fwd:90deg;
  --ink:#0A1230; --n-track:#18244F; --paper-rgb:246,244,239; --lat-unlit:#ECE8DF; --lat-stroke:#E2DED4;
  --tint-blue:#E5F0FF; --tint-orange:#FFF1E6; --tint-violet:#F0EBFF; --tint-lime:#E8F5D0; --ink-lime:#3B5200;
  color-scheme:light;
}
/* evening theme: follows the computer, or the visitor's choice in the top bar */
html[data-theme=dark]{
  /* evening palette shared with haykalah.com: iris surfaces, lavender lines and ink */
  --paper:#1C1840; --paper-rgb:28,24,64; --white:#2E2760; --line:#41377D; --muted:#BDB6E0; --ink:#F4F3FA;
  --night:#120F2C; --night2:#241F52; --n-track:#2E2760; --line-n:#41377D; --muted-n:#BDB6E0;
  --t-blue:#93B6FF; --t-cyan:#6FDDF5; --t-violet:#C3BBEC; --t-magenta:#FF8CC0; --t-tangerine:#FFAE78; --t-lime:#C2EC5C;
  --lat-unlit:#251F55; --lat-stroke:#2E2760;
  --tint-blue:rgba(127,168,255,.1); --tint-orange:rgba(255,174,120,.1); --tint-violet:rgba(179,169,226,.1); --tint-lime:rgba(198,244,50,.09); --ink-lime:#C6F432;
  color-scheme:dark;
}
html[data-theme=dark] nav.top .logo-svg [fill="#0A1230"],html[data-theme=dark] nav.top .logo-svg [fill="#1D1D1B"]{fill:#fff}
html[data-theme=dark] nav.top .logo-svg [fill="#4A5578"]{fill:#BDB6E0}
html[data-theme=dark] img{filter:brightness(.92)}
body{transition:background-color .35s,color .35s}
[dir=rtl]{--f-body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;--fwd:270deg}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[dir=rtl] body{font-size:17px;line-height:1.85}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;position:relative;z-index:1}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:600;line-height:1.12;letter-spacing:-.01em}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] h4{line-height:1.4;letter-spacing:0}
h2{font-size:clamp(28px,3.6vw,44px)}
h3{font-size:22px;line-height:1.25}
.label{font:600 11px/16px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--t-blue)}
[dir=rtl] .label{font-size:13px;line-height:20px;letter-spacing:0}
[dir=rtl] .status,[dir=rtl] .avail,[dir=rtl] .badge,[dir=rtl] .tag,[dir=rtl] .ro-row.h>div,[dir=rtl] .foot .fh,[dir=rtl] .stage,[dir=rtl] .sn,[dir=rtl] .kpi-t .k,[dir=rtl] .card-h{letter-spacing:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.lead{font-size:clamp(17px,1.5vw,19px);color:var(--muted);max-width:720px}
[dir=rtl] .lead{font-size:clamp(18px,1.6vw,20px)}
section{padding:112px 0;position:relative;scroll-margin-top:72px;overflow:hidden}
.sec-head{display:grid;gap:16px;margin-bottom:56px;max-width:820px}
.alt-line{font:600 clamp(22px,2.4vw,30px)/1.5 "IBM Plex Sans Arabic","Readex Pro",sans-serif;unicode-bidi:plaintext;text-align:left}
[dir=rtl] .alt-line{text-align:right}
:focus-visible{outline:2px solid var(--t-blue);outline-offset:3px;border-radius:4px}
.logo-ar{display:none}
[dir=rtl] .logo-en{display:none}
[dir=rtl] .logo-ar{display:block}
.illus-tag{font:500 10px/1 var(--f-mono);letter-spacing:.1em;color:var(--muted-n);border:1px solid var(--line-n);padding:5px 8px;border-radius:999px}
[dir=rtl] .illus-tag{letter-spacing:0;font-size:12px}

/* generated tech backgrounds */
.bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.bg.fade-side{-webkit-mask-image:linear-gradient(var(--fwd),transparent 18%,#000 75%);mask-image:linear-gradient(var(--fwd),transparent 18%,#000 75%)}
.bg.fade-top{-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 60%);mask-image:linear-gradient(180deg,transparent 0%,#000 60%)}
.sweep{transform-box:view-box;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flow{stroke-dasharray:6 14;animation:flow 6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-200}}

/* ---------- top bar & nav ---------- */
.draftbar{background:var(--night);color:var(--muted-n);font:500 12px/1.4 var(--f-mono);text-align:center;padding:9px 16px;letter-spacing:.04em}
[dir=rtl] .draftbar{letter-spacing:0;font-size:13px}
.draftbar b{color:#fff;font-weight:500}
.draftbar .dot{display:inline-block;width:7px;height:7px;background:var(--red);border-radius:50%;margin-inline-end:8px;vertical-align:1px}
nav.top{position:sticky;top:0;z-index:50;background:rgba(var(--paper-rgb),.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
nav.top.scrolled{border-bottom-color:var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:72px;gap:20px}
.nav-in .logo svg{height:30px;width:auto}
.nav-in .logo .logo-ar{height:34px}
.links{display:flex;gap:22px;font:500 14px/1 var(--f-body);color:var(--muted)}
[dir=rtl] .links{font-size:15px}
.links a{position:relative;padding:6px 0;transition:color .2s;white-space:nowrap}
.links a:hover,.links a.active{color:var(--ink)}
.links a.active::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--blue)}
.nav-end{display:flex;align-items:center;gap:10px}
.lang{font:600 14px/1 var(--f-body);background:transparent;border:1.5px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:999px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.lang:hover{border-color:var(--ink)}
.theme{width:40px;height:40px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:inline-grid;place-items:center;transition:.2s}
.theme:hover{border-color:var(--ink)}
.theme .ti{width:18px;height:18px;grid-area:1/1;display:none}
html[data-mode=auto] .ti-auto,html[data-mode=light] .ti-light,html[data-mode=dark] .ti-dark{display:block}
html:not([data-mode]) .ti-auto{display:block}
.lang .g{width:8px;height:16px;background:var(--cyan);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.lang [lang=ar]{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:15px}
.btn{display:inline-flex;align-items:center;gap:10px;font:600 15px/1 var(--f-body);padding:15px 22px;border-radius:999px;transition:transform .2s,background .2s,box-shadow .2s;cursor:pointer;border:0;white-space:nowrap}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 8px 24px -10px rgba(0,102,255,.6)}
.btn.primary:hover{background:#0057D9;transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{background:var(--night);color:#fff}
.btn.sm{padding:11px 18px;font-size:14px}
.menu-btn{display:none;background:none;border:0;cursor:pointer;padding:8px}
.menu-btn span{display:block;width:22px;height:2px;background:var(--night);margin:5px 0;transition:.3s}

/* ---------- hero ---------- */
.hero{padding:72px 0 0;overflow:hidden;position:relative}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;min-height:620px}
.hero h1{font-size:clamp(48px,7vw,92px);line-height:1;letter-spacing:-.025em}
[dir=rtl] .hero h1{font-size:clamp(50px,7.4vw,100px);line-height:1.2;letter-spacing:0}
.hero h1 .lit{background:linear-gradient(var(--fwd),var(--blue),#00A8E8);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .alt-line{color:var(--muted);margin-top:14px}
.hero p.lead{margin:28px 0 36px}
.hero .ctas{display:flex;gap:14px;flex-wrap:wrap}
.hero-art{position:relative;height:620px}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
.hero-art .fade{position:absolute;inset:0;background:linear-gradient(var(--fwd),var(--paper) 0%,rgba(var(--paper-rgb),0) 30%),linear-gradient(0deg,var(--paper) 0%,rgba(var(--paper-rgb),0) 25%);pointer-events:none}
.console{position:absolute;inset-inline-end:6%;bottom:16%;background:rgba(10,18,48,.94);color:#fff;border-radius:12px;padding:16px 18px;font:400 12.5px/1.7 var(--f-mono);width:290px;box-shadow:0 30px 60px -20px rgba(10,18,48,.5)}
[dir=rtl] .console{font-size:13px}
.console .row{display:flex;justify-content:space-between;gap:12px}
.console .k{color:var(--muted-n)}
.console .sev{font-weight:500}
.console .hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--cyan);font-weight:500;letter-spacing:.08em}
[dir=rtl] .console .hdr{letter-spacing:0}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--cyan);animation:pulse 2s ease-in-out infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.illus{font:500 10px/1 var(--f-mono);color:var(--muted-n);letter-spacing:.08em;margin-top:8px}

.stats{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);margin-top:24px}
.stat{padding:28px 20px 34px;border-inline-end:1px solid var(--line)}
.stat:last-child{border-inline-end:0}
.stat .num{font:500 clamp(28px,3vw,40px)/1.1 var(--f-mono);letter-spacing:-.02em;white-space:nowrap}
[dir=rtl] .stat .num{letter-spacing:0}
.stat .num .u{font-size:.62em}
.stat .cap{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.45}
[dir=rtl] .stat .cap{font-size:14.5px;line-height:1.7}
.stat .src{font:400 10.5px/1.4 var(--f-mono);color:#8a93ad;margin-top:8px}
[dir=rtl] .stat .src{font-size:12px}

/* ---------- vision ---------- */
.vision{background:var(--white)}
.vision-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pillar{border:1px solid var(--line);border-radius:var(--radius);padding:24px;background:rgba(var(--paper-rgb),.92);transition:transform .25s,box-shadow .25s;backdrop-filter:blur(2px)}
.pillar:hover{transform:translateY(-3px);box-shadow:0 18px 40px -24px rgba(10,18,48,.35)}
.pillar .gem{width:16px;height:42px;margin-bottom:18px}
.pillar h3{font-size:18px;margin-bottom:8px}
.pillar p{font-size:14.5px;color:var(--muted);line-height:1.55}
[dir=rtl] .pillar p{font-size:15.5px;line-height:1.8}
.chart-card{border:1px solid var(--line);border-radius:var(--radius);padding:28px;background:rgba(var(--paper-rgb),.94)}
.chart-card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;vertical-align:-1px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:260px;border-bottom:1px solid var(--line);position:relative;direction:ltr}
.bar{position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:default}
.bar .tam{background:var(--blue);border-radius:6px 6px 0 0;position:relative;transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.bar .sam{position:absolute;left:0;right:0;bottom:0;background:var(--cyan);transition:height 1.1s cubic-bezier(.2,.8,.2,1) .15s}
.bar .val{position:absolute;top:-22px;left:0;right:0;text-align:center;font:500 12px var(--f-mono);color:var(--ink)}
.bar:hover .tam{background:#0057D9}
.yrs{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;font:400 12px var(--f-mono);color:var(--muted);text-align:center;margin-top:8px;direction:ltr}
.source{font:400 11px/1.5 var(--f-mono);color:#8a93ad;margin-top:16px}
[dir=rtl] .source{font-size:12.5px;line-height:1.8}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.splitbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex;margin:10px 0 6px}
.splitbar span{display:block;height:100%}
.split .t{font-size:13px;color:var(--muted)}
.split .n{font:500 13px var(--f-mono)}
.journey{margin-top:80px}
.tl{display:grid;grid-template-columns:repeat(6,1fr);position:relative;margin-top:36px}
.tl::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:linear-gradient(var(--fwd),var(--blue),var(--cyan),var(--violet),var(--magenta),var(--tangerine),var(--lime))}
.tl .m{position:relative;padding-top:34px;padding-inline-end:16px}
.tl .m::before{content:"";position:absolute;top:0;inset-inline-start:0;width:12px;height:20px;background:var(--c);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.tl .y{font:500 14px var(--f-mono);color:var(--ink)}
.tl h3{font-size:15.5px;margin:8px 0 6px}
.tl p{font-size:13.5px;color:var(--muted);line-height:1.5}
[dir=rtl] .tl p{font-size:14.5px;line-height:1.75}

/* ---------- regulation ---------- */
.reg-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.chip{font:500 13px/1.2 var(--f-body);padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--white);cursor:pointer;color:var(--muted);transition:.2s}
[dir=rtl] .chip{font-size:14px}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.reg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.reg{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:12px;transition:opacity .3s,transform .3s,box-shadow .25s;position:relative;overflow:hidden}
.reg:hover{box-shadow:0 18px 40px -26px rgba(10,18,48,.4)}
.reg.dim{opacity:.28;transform:scale(.985)}
.reg .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.reg .code{font:500 13px var(--f-mono);color:var(--t-blue)}
.status{font:600 10px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:6px 9px;border-radius:999px;white-space:nowrap}
[dir=rtl] .status{font-size:12px}
.st-force{background:var(--tint-blue);color:var(--t-blue)}
.st-draft{background:var(--tint-orange);color:var(--t-tangerine)}
.st-notified{background:var(--tint-violet);color:var(--t-violet)}
.reg h3{font-size:18px}
.reg p{font-size:14px;color:var(--muted);line-height:1.55}
[dir=rtl] .reg p{font-size:15px;line-height:1.8}
.reg .who{font-size:12.5px;color:var(--ink);border-top:1px dashed var(--line);padding-top:12px;margin-top:auto}
[dir=rtl] .reg .who{font-size:13.5px}
.reg .who b{font-weight:600}
.reg .figure{font:500 30px/1.1 var(--f-mono)}
.reg .figure small{font-size:13px;color:var(--muted);font-family:var(--f-body);margin-inline-start:6px}

/* ---------- licensing perimeter ---------- */
.perimeter{background:var(--white)}
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:56px}
.tier{border-radius:20px;padding:32px;position:relative;overflow:hidden}
.tier.t1{background:var(--night);color:#fff}
.tier.t2{background:var(--paper);border:1px solid var(--line)}
.tier .badge{display:inline-flex;align-items:center;gap:8px;font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;padding:8px 12px;border-radius:999px}
[dir=rtl] .tier .badge{font-size:13px}
.t1 .badge{background:rgba(255,255,255,.1);color:var(--cyan)}
.t2 .badge{background:var(--tint-blue);color:var(--t-blue)}
.tier h3{font-size:28px;margin:18px 0 8px}
.tier .count{font:500 64px/1 var(--f-mono);letter-spacing:-.03em;margin:18px 0 4px}
.tier ul{list-style:none;display:grid;gap:10px;margin-top:20px;font-size:14.5px}
[dir=rtl] .tier ul{font-size:15.5px}
.tier li{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start}
.tier li::before{content:"";width:8px;height:18px;margin-top:3px;background:currentColor;opacity:.55;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
[dir=rtl] .tier li::before{margin-top:7px}
.t1 li{color:#D8DDEC}
.t2 li{color:var(--muted)}
.tier .gate{position:absolute;inset-inline-end:24px;top:24px;font:500 11px var(--f-mono);letter-spacing:.06em;padding:7px 10px;border-radius:6px}
[dir=rtl] .tier .gate{letter-spacing:0;font-size:12px}
.t1 .gate{background:rgba(255,77,94,.15);color:#FF8A95}
.t2 .gate{background:var(--tint-lime);color:var(--ink-lime)}
.window{border:1px solid var(--line);border-radius:20px;padding:32px;background:var(--paper)}
.window-track{display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr;margin-top:28px;position:relative}
.wstep{padding-inline-end:18px;position:relative}
.wstep .bar{height:6px;border-radius:3px;margin-bottom:16px}
.wstep .d{font:500 13px var(--f-mono)}
.wstep h3{font-size:16px;margin:6px 0}
.wstep p{font-size:13.5px;color:var(--muted);line-height:1.5}
[dir=rtl] .wstep p{font-size:14.5px;line-height:1.75}
.rule{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin-top:28px;padding:20px;background:var(--white);border-radius:12px;border-inline-start:4px solid var(--magenta)}
.rule b{font-family:var(--f-head);font-weight:600}
.path{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:56px}
.step{border:1px solid var(--line);border-radius:var(--radius);padding:26px;background:var(--white);position:relative}
.step .n{font:500 13px var(--f-mono);color:var(--t-blue)}
.step h3{font-size:19px;margin:10px 0 8px}
.step p{font-size:14px;color:var(--muted)}
[dir=rtl] .step p{font-size:15px}
.step .tag{display:inline-block;margin-top:14px;font:600 10px/1.3 var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:6px 9px;border-radius:999px}
[dir=rtl] .step .tag{font-size:12px}

/* ---------- night sections ---------- */
.night{background:var(--night);color:#fff}
.night .label{color:var(--cyan)}
.night .lead{color:var(--muted-n)}
.loop-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.loop-svg{width:100%;max-width:520px;margin:0 auto;aspect-ratio:1;direction:ltr}
.loop-svg .node{cursor:pointer}
.loop-svg .node path{transition:transform .3s;transform-box:fill-box;transform-origin:center}
.loop-svg .node:hover path,.loop-svg .node.on path{transform:scale(1.18)}
.loop-svg text{font-family:var(--f-body);font-size:14px;fill:#fff}
[dir=rtl] .loop-svg text{font-size:16px}
.stage-panel{background:rgba(17,28,66,.92);border:1px solid var(--line-n);border-radius:20px;padding:32px;min-height:340px}
.stage-panel .sn{font:500 13px var(--f-mono);letter-spacing:.08em}
.stage-panel h3{font-size:32px;margin:10px 0 14px}
.stage-panel p{color:#C9D0E4}
.stage-panel ul{list-style:none;margin-top:20px;display:grid;gap:10px}
.stage-panel li{font:400 13.5px/1.5 var(--f-mono);color:var(--muted-n);padding-inline-start:18px;position:relative}
[dir=rtl] .stage-panel li{font-size:15px;line-height:1.7}
.stage-panel li::before{content:"";position:absolute;inset-inline-start:0;top:6px;width:6px;height:10px;background:var(--sc);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
[dir=rtl] .stage-panel li::before{top:9px}
.stage-panel .kpi{display:flex;gap:28px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line-n)}
.stage-panel .kpi div{font:500 24px var(--f-mono)}
.stage-panel .kpi small{display:block;font:400 11.5px var(--f-body);color:var(--muted-n);margin-top:4px}
[dir=rtl] .stage-panel .kpi small{font-size:13px}
.compound{margin-top:56px;padding:24px 28px;border-radius:16px;background:linear-gradient(var(--fwd),rgba(0,102,255,.18),rgba(198,244,50,.08));border:1px solid var(--line-n);display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;backdrop-filter:blur(3px)}
.compound .big{font:500 44px/1 var(--f-mono);color:var(--lime);direction:ltr}

/* ---------- services ---------- */
.selector{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.selector .q{font:600 14px var(--f-head);margin-inline-end:8px}
[dir=rtl] .selector .q{font-size:16px}
.sector-note{font-size:14px;color:var(--muted);margin-bottom:28px;min-height:44px;max-width:860px}
[dir=rtl] .sector-note{font-size:15.5px}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.svc{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px;position:relative;transition:transform .25s,box-shadow .25s,opacity .3s}
.svc:hover{transform:translateY(-4px);box-shadow:0 24px 48px -28px rgba(10,18,48,.45)}
.svc .gem{width:18px;height:48px}
.svc .stage{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
[dir=rtl] .svc .stage{font-size:13px}
.svc h3{font-size:21px}
.svc p{font-size:14.5px;color:var(--muted);line-height:1.55}
[dir=rtl] .svc p{font-size:15.5px;line-height:1.8}
.svc dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-top:4px;padding-top:14px;border-top:1px dashed var(--line)}
.svc dt{color:var(--muted);font-weight:500}
.svc dd{font-family:var(--f-mono);font-size:12.5px}
[dir=rtl] .svc dl{font-size:14px}[dir=rtl] .svc dd{font-size:13.5px}
.avail{position:absolute;top:24px;inset-inline-end:24px;font:600 10px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:7px 10px;border-radius:999px;transition:.3s}
[dir=rtl] .avail{font-size:12px}
.av-now{background:var(--tint-lime);color:var(--ink-lime)}
.av-opt{background:var(--tint-violet);color:var(--t-violet)}
.av-rfcs{background:var(--tint-orange);color:var(--t-tangerine)}
.svc.prio{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}

/* ---------- dashboard ---------- */
.dash-frame{background:rgba(17,28,66,.9);border:1px solid var(--line-n);border-radius:22px;padding:22px;box-shadow:0 40px 90px -40px rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.dash-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line-n)}
.dash-id{display:flex;align-items:center;gap:12px;font:500 13px var(--f-mono);letter-spacing:.1em}
[dir=rtl] .dash-id{letter-spacing:0;font-size:14px}
.dash-id svg{height:28px;width:auto}
.envs{display:flex;gap:6px;flex-wrap:wrap}
.envs button{font:500 12.5px/1 var(--f-body);background:transparent;border:1px solid var(--line-n);color:var(--muted-n);padding:9px 12px;border-radius:999px;cursor:pointer;transition:.2s}
[dir=rtl] .envs button{font-size:13.5px}
.envs button.on{background:#fff;color:var(--night);border-color:#fff}
.clock{display:flex;align-items:center;gap:8px;font:500 12.5px var(--f-mono);color:var(--muted-n)}
.clock b{color:#fff;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:18px 0}
.kpi-t{background:var(--night);border:1px solid var(--line-n);border-radius:14px;padding:16px}
.kpi-t .k{font:600 10px/1.3 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted-n)}
[dir=rtl] .kpi-t .k{font-size:12px}
.kpi-t .v{font:500 26px/1.2 var(--f-mono);margin-top:8px;color:#fff}
.kpi-t .d{font:400 11.5px var(--f-mono);margin-top:4px}
.up{color:var(--lime)} .dn{color:#FF8A95}
.dgrid{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.dgrid+.dgrid{margin-top:12px}
.dcard{background:var(--night);border:1px solid var(--line-n);border-radius:14px;padding:18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font:600 11px/1.3 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted-n);margin-bottom:12px}
[dir=rtl] .card-h{font-size:13px}
.card-h .lg{display:flex;gap:12px;text-transform:none;letter-spacing:0;font-weight:400}
.card-h .lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:5px}
.area svg{width:100%;height:190px;direction:ltr}
.sevrow{display:grid;grid-template-columns:76px 1fr 46px;gap:10px;align-items:center;margin:12px 0;font:500 12px var(--f-mono)}
[dir=rtl] .sevrow{grid-template-columns:70px 1fr 46px;font-size:13px}
.sevrow .tr{height:10px;background:var(--n-track);border-radius:5px;overflow:hidden}
.sevrow .fl{height:100%;border-radius:5px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.sevrow .c{text-align:end;color:#fff}
.feed{overflow-x:auto}
.feed table{width:100%;border-collapse:collapse;font:400 12.5px var(--f-mono);min-width:560px}
[dir=rtl] .feed table{font-size:13px}
.feed th{text-align:start;font:600 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted-n);padding:6px 8px;border-bottom:1px solid var(--line-n)}
[dir=rtl] .feed th{letter-spacing:0;font-size:12px}
.feed td{padding:9px 8px;border-bottom:1px solid var(--n-track);color:#D8DDEC;white-space:nowrap}
.feed tr.new td{animation:rowin 1.2s ease}
@keyframes rowin{from{background:rgba(0,209,255,.16)}to{background:transparent}}
.sv{font-weight:500}
.st-pill{font:500 11px var(--f-body);padding:4px 8px;border-radius:999px;background:var(--n-track)}
.tac{margin:9px 0}
.tac .row{display:flex;justify-content:space-between;font:400 12px var(--f-body);color:#D8DDEC;margin-bottom:5px}
[dir=rtl] .tac .row{font-size:13.5px}
.tac .tr{height:6px;background:var(--n-track);border-radius:3px;overflow:hidden}
.tac .fl{height:100%;background:linear-gradient(var(--fwd),var(--blue),var(--cyan));transition:width .8s}
.assetmap svg{width:100%;margin-top:6px}
.dash-note{font:400 11px var(--f-mono);color:#6F7A9C;margin-top:14px;text-align:center}
[dir=rtl] .dash-note{font-size:12.5px}

/* ---------- compliance lattice ---------- */
.comp-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:center}
.comp-lattice{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:28px}
.comp-lattice svg path{transition:transform .2s;transform-box:fill-box;transform-origin:center;cursor:pointer}
.comp-lattice svg path:hover{transform:scale(1.3)}
.comp-tip{font:400 12.5px var(--f-mono);color:var(--muted);margin-top:14px;min-height:20px}
[dir=rtl] .comp-tip{font-size:14px}
.comp-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-top:10px}
.comp-legend i{display:inline-block;width:8px;height:16px;margin-inline-end:6px;vertical-align:-3px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.fw-list{display:grid;gap:12px;margin-top:28px}
.fw{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.fw .c{font:500 13px var(--f-mono);color:var(--t-blue)}
.fw .v{font:500 14px var(--f-mono)}

/* ---------- maturity & assessment ---------- */
.stairs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:300px;direction:ltr}
.stairs button{position:relative;border:0;cursor:pointer;border-radius:12px 12px 4px 4px;color:#fff;font:600 14px var(--f-head);padding:14px 10px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;transition:transform .25s,box-shadow .25s,filter .25s;background:var(--bgc)}
[dir=rtl] .stairs button{text-align:right;direction:rtl}
.stairs button:hover{transform:translateY(-4px)}
.stairs button.on{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--night)}
.stairs button .lv{font:500 26px/1 var(--f-mono)}
.stairs button .nm{font-size:12.5px;line-height:1.25;opacity:.92}
[dir=rtl] .stairs button .nm{font-size:13.5px;line-height:1.5}
.stairs .minflag{position:absolute;top:-34px;inset-inline-start:0;font:600 10px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--t-blue);white-space:nowrap}
[dir=rtl] .stairs .minflag{letter-spacing:0;font-size:12px}
.stairs .minflag::after{content:"";display:block;width:2px;height:14px;background:var(--t-blue);margin-top:4px}
.lvl-panel{margin-top:24px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:28px}
.lvl-panel h3{font-size:24px;margin:6px 0 10px}
.lvl-panel .help{background:var(--paper);border-radius:12px;padding:18px;font-size:14.5px}
.lvl-panel .help b{display:block;font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--t-blue);margin-bottom:8px}
[dir=rtl] .lvl-panel .help b{letter-spacing:0;font-size:13px}
.assess{margin-top:72px;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.sliders{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:18px}
.sl .top{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;font-weight:500}
.sl .top .n{font:500 12px var(--f-mono);color:var(--t-blue);margin-inline-end:8px}
.sl .top .val{font:500 13px var(--f-mono);color:var(--muted);text-align:end}
.assess>*{min-width:0}
@media (max-width:720px){.sl .top{flex-direction:column;gap:2px}.sl .top .val{text-align:start}}
.sl input[type=range]{width:100%;margin-top:8px;accent-color:var(--blue);cursor:pointer}
.result{background:var(--night);color:#fff;border-radius:18px;padding:28px;position:relative;overflow:hidden}
.result .radar svg{width:100%;max-width:400px;margin:0 auto;direction:ltr}
.radar text{font:500 12px var(--f-mono);fill:#9AA6C6}
.scorebar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.scorebar>div{background:var(--night2);border:1px solid var(--line-n);border-radius:12px;padding:14px}
.scorebar .k{font:600 10px/1.3 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted-n)}
[dir=rtl] .scorebar .k{letter-spacing:0;font-size:12px}
.scorebar .v{font:500 24px/1.2 var(--f-mono);margin-top:6px}
.recs{margin-top:16px;display:grid;gap:8px}
.recs div{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:14px;color:#D8DDEC;background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px}
.recs div i{width:8px;height:20px;margin-top:2px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.recs b{color:#fff;font-weight:600}
.rlegend{display:flex;gap:16px;justify-content:center;font-size:12.5px;color:var(--muted-n);margin-top:4px}
.rlegend i{display:inline-block;width:14px;height:3px;margin-inline-end:6px;vertical-align:3px}

/* ---------- brand pillars / roshan ---------- */
.ro-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.ro-table{display:grid;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--white)}
.ro-row{display:grid;grid-template-columns:1fr 1fr 1.1fr;font-size:14px}
[dir=rtl] .ro-row{font-size:15px}
.ro-row>div{padding:16px 18px;border-bottom:1px solid var(--line)}
.ro-row:last-child>div{border-bottom:0}
.ro-row.h>div{background:var(--paper);font:600 11px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
[dir=rtl] .ro-row.h>div{font-size:13px}
.ro-row .q{font-family:var(--f-head);font-weight:600}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:64px}
.four .p{padding:24px;border-radius:16px;background:var(--white);border:1px solid var(--line)}
.four .p h3{font-size:19px;margin:14px 0 6px}
.four .p p{font-size:14px;color:var(--muted)}
[dir=rtl] .four .p p{font-size:15px}
.voice{margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.voice div{padding:18px 20px;border-radius:12px;background:var(--night);color:#fff;font:400 13px/1.6 var(--f-mono)}
[dir=rtl] .voice div{font-size:14.5px;line-height:1.8}
.voice div span{color:var(--cyan)}

/* ---------- roadmap ---------- */
.gates{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.gatec{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px;position:relative;overflow:hidden}
.gatec::after{content:"";position:absolute;left:0;top:0;height:4px;width:100%;background:var(--c)}
.gatec .g{font:500 28px/1 var(--f-mono);color:var(--c2)}
.gatec h3{font-size:16px;margin:14px 0 8px}
.gatec p{font-size:13.5px;color:var(--muted);line-height:1.5}
[dir=rtl] .gatec p{font-size:14.5px;line-height:1.75}
.gatec .ev{margin-top:14px;font:400 11.5px/1.5 var(--f-mono);color:var(--ink);background:var(--paper);padding:8px 10px;border-radius:8px}
[dir=rtl] .gatec .ev{font-size:13px}
.talent{margin-top:56px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.talent .t{padding:24px;border-radius:16px;border:1px solid var(--line);background:var(--white)}
.talent .t .num{font:500 34px/1.1 var(--f-mono)}
.talent .t p{font-size:13.5px;color:var(--muted);margin-top:10px}
[dir=rtl] .talent .t p{font-size:15px}

/* ---------- CTA / footer ---------- */
.cta{padding:120px 0}
.cta h2{font-size:clamp(36px,5vw,64px);max-width:860px}
.cta .alt-line{color:var(--cyan);margin-top:12px}
.cta p{color:var(--muted-n);max-width:640px;margin:24px 0 36px}
.cta .btn.ghost{color:#fff;box-shadow:inset 0 0 0 1.5px #fff}
.cta .btn.ghost:hover{background:#fff;color:var(--night)}
footer{background:var(--night);color:var(--muted-n);border-top:1px solid var(--line-n);padding:48px 0 40px;font-size:13px}
[dir=rtl] footer{font-size:14.5px}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px}
.foot .logo-svg{height:28px;width:auto;margin-bottom:16px}
.foot .logo-ar.logo-svg{height:34px}
.foot .fh{font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:#fff;margin-bottom:14px}
[dir=rtl] .foot .fh{font-size:13px}
.foot ul{list-style:none;display:grid;gap:8px}
.foot a:hover{color:#fff}
.hero-photo{position:absolute;top:56px;inset-inline-start:36px;width:calc(100% - 36px);height:calc(100% - 112px);object-fit:cover;border-radius:28px;box-shadow:0 30px 80px -30px rgba(10,18,48,.45)}
.hero-art .hero-photo~svg{opacity:.18;-webkit-mask-image:linear-gradient(var(--fwd),#000,transparent 70%);mask-image:linear-gradient(var(--fwd),#000,transparent 70%)}
.sec-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.26;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent)}
.photo-band{margin:56px 0 0;border-radius:24px;overflow:hidden;aspect-ratio:1376/560;box-shadow:0 24px 70px -34px rgba(10,18,48,.4)}
.photo-band img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:720px){.hero-photo{inset-inline-start:0;width:100%;top:24px;height:calc(100% - 48px)}.photo-band{aspect-ratio:4/3;margin-top:36px}}
.consent{position:fixed;z-index:95;inset-inline:16px;bottom:16px;max-width:560px;margin-inline-start:auto;background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px -24px rgba(10,18,48,.45);padding:18px 20px;display:grid;gap:14px;font-size:14.5px;line-height:1.55;animation:rise .5s var(--ease-out,ease) both}
.consent-b{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.cookie-link{background:none;border:0;padding:0;margin-top:12px;font:inherit;font-size:12.5px;color:var(--muted-n);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.cookie-link:hover{color:#fff}
.disclaimer{margin-top:40px;padding-top:24px;border-top:1px solid var(--line-n);font:400 11.5px/1.6 var(--f-mono);color:#A3ACC9}
[dir=rtl] .disclaimer{font-size:13px;line-height:1.9}

/* ---------- reveal ---------- */
.js .rv{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
@keyframes breathe{0%,100%{opacity:var(--o1,.95)}50%{opacity:var(--o2,.25)}}
.lit-cell{animation:breathe var(--d,8s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.off .lit-cell,.off .flow,.off .sweep{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none}}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .links{display:none;position:absolute;top:72px;left:0;right:0;flex-direction:column;background:var(--paper);padding:20px 24px 28px;gap:18px;border-bottom:1px solid var(--line);font-size:16px}
  .links.open{display:flex}
  .menu-btn{display:block}
  .kpis{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:1024px){
  .hero-grid,.vision-grid,.loop-grid,.comp-grid,.ro-grid,.dgrid,.assess,.lvl-panel{grid-template-columns:1fr}
  .hero-art{height:420px;order:-1;margin:0 -24px}
  .hero-grid{min-height:0}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat:nth-child(3){border-inline-end:0}
  .reg-grid,.svc-grid{grid-template-columns:1fr 1fr}
  .gates{grid-template-columns:repeat(3,1fr)}
  .four,.talent{grid-template-columns:1fr 1fr}
  .tl{grid-template-columns:repeat(3,1fr);row-gap:36px}
  .tl::before{display:none}
}
@media (max-width:720px){
  .nav-cta{display:none}
  .wrap{padding:0 16px}
  section{padding:80px 0}
  .hero-art{margin:0 -16px;height:340px}
  .console{inset-inline-end:16px;bottom:8%;width:250px;font-size:11.5px}
  .stats{grid-template-columns:1fr 1fr}
  .stat{border-inline-end:0;border-bottom:1px solid var(--line);padding:20px 8px}
  .stat:nth-child(odd){border-inline-end:1px solid var(--line)}
  .stat:last-child{grid-column:1/-1;border-inline-end:0}
  .reg-grid,.svc-grid,.tiers,.path,.pillars,.split,.four,.talent,.voice{grid-template-columns:1fr}
  .gates,.kpis,.scorebar{grid-template-columns:1fr 1fr}
  .tl{grid-template-columns:1fr 1fr}
  .window-track{grid-template-columns:1fr 1fr;row-gap:24px}
  .ro-row{grid-template-columns:1fr 1fr;font-size:13px}
  .ro-row>div:nth-child(2){display:none}
  .fw{grid-template-columns:96px 1fr}
  .fw .v{grid-column:2}
  .foot{grid-template-columns:1fr}
  .bars,.yrs{gap:5px}
  .bar .val{font-size:10px}
  .compound{grid-template-columns:1fr}
  .tier .gate{position:static;display:inline-block;margin-inline-start:8px}
  .lang{padding:9px 12px}
  .dash-frame{padding:14px;border-radius:16px}
  .stairs{height:240px;gap:5px}
  .stairs button{padding:10px 6px}
  .stairs button .nm{display:none}
  .stairs .minflag{font-size:9px}
  .scorebar>div:last-child{grid-column:1/-1}
}

/* ==========================================================================
   Motion layer, shared by every page.
   Easing follows "fast out, soft land": ease-out quint for entrances, short
   durations for anything the visitor triggers. Everything here switches off
   under prefers-reduced-motion.
   ========================================================================== */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-io:cubic-bezier(.65,0,.35,1)}

/* ---------- scroll progress ---------- */
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:80;pointer-events:none;transform-origin:0 50%;transform:scaleX(var(--p,0));background:linear-gradient(90deg,var(--blue),var(--cyan),var(--violet),var(--magenta),var(--tangerine),var(--lime))}
[dir=rtl] .progress{transform-origin:100% 50%;background:linear-gradient(270deg,var(--blue),var(--cyan),var(--violet),var(--magenta),var(--tangerine),var(--lime))}

/* ---------- reveal (upgrades the base .rv) ---------- */
.js .rv{opacity:0;transform:translateY(34px) scale(.985);filter:blur(6px);transition:opacity .9s var(--ease-out),transform .9s var(--ease-out),filter .9s var(--ease-out)}
.js .rv.in{opacity:1;transform:none;filter:none}
/* the first screen is never hidden: it only rises into place */
.js .hero .rv{opacity:1;filter:none;transform:none;transition:none;animation:rise .9s var(--ease-out) both}
@keyframes rise{from{transform:translateY(22px)}to{transform:none}}

/* ---------- split headings: words rise out of a mask ---------- */
.sw{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em;margin-bottom:-.08em}
.sw>span{display:inline-block;transform:translateY(105%);transition:transform .85s var(--ease-out);transition-delay:calc(var(--i,0) * 45ms)}
.wsplit.in .sw>span{transform:none}
.hero h1 .sw{padding-bottom:.14em;margin-bottom:-.14em}
/* Arabic: dots, shadda and tanween sit well outside the Latin line box, so give the mask room above and below */
[dir=rtl] .sw{padding:.18em 0 .42em;margin:-.18em 0 -.42em}
[dir=rtl] .sw>span{transform:translateY(130%)}
.hero h1 .lit .sw>span{background:linear-gradient(var(--fwd),var(--blue),#00A8E8);-webkit-background-clip:text;background-clip:text;color:transparent;padding:.22em .04em .45em;margin:-.22em -.04em -.45em}

/* ---------- full-page card snap (desktop, fine pointer) ---------- */
html.snap{scroll-snap-type:y mandatory;scroll-padding-top:72px;scroll-behavior:auto}
html.snap-soft{scroll-snap-type:y proximity;scroll-padding-top:72px}
html.snap body>header.hero,html.snap body>section,html.snap-soft body>header.hero,html.snap-soft body>section{scroll-snap-align:start;scroll-margin-top:0}
html.snap body>section,html.snap body>header.hero{min-height:calc(100vh - 72px);min-height:calc(100svh - 72px);display:flex;flex-direction:column;justify-content:center}
html.snap body>section>.wrap,html.snap body>header.hero>.wrap{width:100%}
/* each section is a card that slides over the one before */
html.cards body>section{border-radius:34px 34px 0 0;margin-top:-34px;box-shadow:0 -28px 60px -38px rgba(10,18,48,.55)}
html.cards body>section>.wrap{transform-origin:50% 0;transform:translateY(calc(var(--x,0) * -40px)) scale(calc(1 - var(--x,0) * .07));opacity:calc(1 - var(--x,0) * .55)}
html.cards body>section::after{content:"";position:absolute;inset:0;background:#0A1230;opacity:calc(var(--x,0) * .45);pointer-events:none;z-index:2}
html.cards body>header.hero>.wrap{transform:scale(calc(1 - var(--x,0) * .06));opacity:calc(1 - var(--x,0) * .6);transform-origin:50% 0}
html.cards footer{position:relative;z-index:40}

/* ---------- dot navigator ---------- */
.dots{position:fixed;top:50%;inset-inline-end:18px;transform:translateY(-50%);z-index:70;display:flex;flex-direction:column;gap:12px;padding:12px 8px;border-radius:999px;background:rgba(var(--paper-rgb),.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px -18px rgba(10,18,48,.5)}
.dots.on-night{background:rgba(17,28,66,.55)}
.dots button{position:relative;width:10px;height:18px;border:0;padding:0;cursor:pointer;background:#9AA6C6;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transition:background .25s,transform .35s var(--ease-out)}
.dots button:hover{transform:scale(1.25)}
.dots button.on{background:var(--c,var(--cyan));transform:scale(1.45)}
.dots .tip{position:fixed;inset-inline-end:52px;font:600 12px/1 var(--f-body);background:var(--night);color:#fff;padding:7px 10px;border-radius:8px;white-space:nowrap;opacity:0;transform:translateX(6px);transition:opacity .2s,transform .2s var(--ease-out);pointer-events:none}
.dots .tip.show{opacity:1;transform:none}

/* ---------- cursor light ---------- */
.glow{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;z-index:45;background:radial-gradient(closest-side,rgba(0,102,255,.13),rgba(0,209,255,.06) 45%,transparent 72%);transform:translate3d(var(--gx,-999px),var(--gy,-999px),0);transition:opacity .4s;mix-blend-mode:multiply}
.glow.on-night{mix-blend-mode:screen;background:radial-gradient(closest-side,rgba(0,209,255,.18),rgba(139,92,255,.08) 45%,transparent 72%)}

/* ---------- magnetic buttons + tilt cards ---------- */
.mag{transition:transform .35s var(--ease-out),background .2s,box-shadow .2s}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0));transition:transform .45s var(--ease-out),box-shadow .3s;will-change:transform;position:relative}
.tilt::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--sh,0);transition:opacity .3s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(0,209,255,.16),transparent 45%);z-index:0}
.night .tilt::before,.result.tilt::before{background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(0,209,255,.22),transparent 45%)}

/* ---------- parallax backgrounds ---------- */
.bg{transform:translate3d(0,var(--py,0px),0) scale(1.08)}

/* ---------- hero: tilt + spotlight + typing console + ticker ---------- */
.hero-art{transform:perspective(1200px) rotateX(var(--hrx,0deg)) rotateY(var(--hry,0deg));transition:transform .6s var(--ease-out)}
.hero-art .spot{position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px circle at var(--hx,70%) var(--hy,40%),rgba(0,209,255,.28),rgba(139,92,255,.10) 40%,transparent 70%);mix-blend-mode:multiply;transition:opacity .4s}
.console .row{opacity:0;transform:translateY(6px);animation:typeIn .5s var(--ease-out) forwards;animation-delay:calc(.9s + var(--r,0) * .38s)}
.console .caret{display:inline-block;width:7px;height:13px;background:var(--cyan);margin-inline-start:6px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes typeIn{to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
.ticker{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);direction:ltr}
.ticker .tk{display:flex;gap:44px;width:max-content;padding:14px 0;animation:tick 38s linear infinite;font:500 13px/1 var(--f-mono);color:var(--muted);letter-spacing:.06em}
.ticker .tk span{display:inline-flex;align-items:center;gap:44px;white-space:nowrap}
.ticker .tk span::after{content:"";width:6px;height:12px;background:var(--cyan);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.ticker:hover .tk{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}

/* ---------- small extras ---------- */
.svc-links{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.svc-links .q{font:600 14px var(--f-head);margin-inline-end:6px}
.svc-links a{font:500 14px/1.2 var(--f-body);padding:11px 16px;border-radius:999px;background:var(--white);border:1px solid var(--line);transition:border-color .2s,color .2s,transform .35s var(--ease-out)}
.svc-links a:hover{border-color:var(--blue);color:var(--t-blue)}
.svc-links a::after{content:" →";color:var(--t-blue)}
[dir=rtl] .svc-links a::after{content:" ←"}
.foot{grid-template-columns:1.4fr 1fr 1fr 1fr}
@media (max-width:720px){.foot{grid-template-columns:1fr}.dots{display:none}}
@media (max-width:1023px){.dots{display:none}}
@media (pointer:coarse){.glow{display:none}}

@media (prefers-reduced-motion:reduce){
  .js .rv{opacity:1;transform:none;filter:none}
  .sw>span{transform:none}
  .console .row{opacity:1;transform:none;animation:none}
  .glow,.hero-art .spot,.progress{display:none}
  .ticker .tk{animation:none}
}

/* ---------- service landing pages ---------- */
.crumbs{font:500 13px/1.4 var(--f-body);color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.crumbs a{color:var(--t-blue)}
.crumbs span[aria-hidden]{color:#B4BBD0}
.lp-hero{background:var(--paper)}
.lp-hero .grid{display:grid;grid-template-columns:1.25fr .9fr;gap:56px;align-items:center}
.lp-hero h1{font-size:clamp(40px,5.2vw,68px);line-height:1.04;letter-spacing:-.02em;margin:18px 0 22px}
[dir=rtl] .lp-hero h1{line-height:1.3;letter-spacing:0}
.lp-hero .ctas{display:flex;gap:14px;flex-wrap:wrap;margin-top:32px}
.lp-facts{display:grid;gap:14px}
.lp-fact{background:var(--night);color:#fff;border-radius:18px;padding:22px 24px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;box-shadow:0 30px 60px -36px rgba(10,18,48,.6)}
.lp-fact .n{font:500 30px/1 var(--f-mono);color:var(--c,var(--cyan));min-width:96px}
.lp-fact p{color:#C9D0E4;font-size:14.5px;line-height:1.5}
[dir=rtl] .lp-fact p{font-size:15.5px;line-height:1.7}
.lp-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.lp-card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:10px}
.lp-card .gem{width:14px;height:36px}
.lp-card h3{font-size:19px}
.lp-card p{font-size:14.5px;color:var(--muted);line-height:1.6}
[dir=rtl] .lp-card p{font-size:15.5px;line-height:1.8}
.lp-steps{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;counter-reset:st;list-style:none}
.lp-steps li{background:var(--night2);border:1px solid var(--line-n);border-radius:16px;padding:20px 18px;position:relative;overflow:hidden}
.lp-steps li::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.lp-steps .k{font:500 12px var(--f-mono);color:var(--c);letter-spacing:.08em}
.lp-steps h3{font-size:17px;color:#fff;margin:10px 0 6px}
.lp-steps p{font-size:13.5px;color:#C9D0E4;line-height:1.5}
[dir=rtl] .lp-steps p{font-size:14.5px;line-height:1.7}
.lp-fw{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.lp-fw div{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.lp-fw b{font:500 14px var(--f-mono);color:var(--t-blue)}
.lp-fw span{font-size:14.5px;color:var(--muted)}
.faq{display:grid;gap:12px;max-width:900px}
.faq details{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:0 22px;transition:border-color .2s}
.faq details[open]{border-color:var(--blue)}
.faq summary{cursor:pointer;list-style:none;font:600 17px/1.4 var(--f-head);padding:20px 0;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";flex:none;width:10px;height:18px;background:var(--blue);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transition:transform .35s var(--ease-out)}
.faq details[open] summary::after{transform:rotate(90deg)}
.faq details p{color:var(--muted);padding:0 0 20px;line-height:1.7}
[dir=rtl] .faq details p{line-height:1.9}
.lp-related{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lp-related a{display:block;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px;transition:border-color .2s}
.lp-related a:hover{border-color:var(--blue)}
.lp-related b{display:block;font:600 18px var(--f-head);margin-bottom:6px}
.lp-related span{font-size:14px;color:var(--t-blue)}
@media (max-width:1024px){.lp-hero .grid{grid-template-columns:1fr}.lp-cards,.lp-related{grid-template-columns:1fr 1fr}.lp-steps{grid-template-columns:repeat(3,1fr)}}
@media (max-width:720px){.lp-cards,.lp-related,.lp-fw{grid-template-columns:1fr}.lp-steps{grid-template-columns:1fr 1fr}.lp-fw div{grid-template-columns:1fr;gap:6px}}

.lp-side{display:grid;gap:16px}
.lp-photo{margin:0;border-radius:22px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 24px 60px -30px rgba(10,18,48,.45)}
.lp-photo img{width:100%;height:100%;object-fit:cover;display:block}
</style>
